<!DOCTYPE html>
<html lang="pt-BR" data-theme="system">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Triar · Finanças da Família</title>
<meta name="theme-color" content="#2f6df0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="stylesheet" href="assets/app.css">
<style>
  /* Só o que é específico desta tela. O resto vem de app.css. */
  .lote { border-left: 3px solid var(--acento); }
  .tri-topo { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .tri-desc { font-size:1.125rem; font-weight:600; line-height:1.3; margin:8px 0 2px; word-break:break-word; }
  .tri-meta { color:var(--muted); font-size:.8125rem; }
  .tri-valor { font-size:1.75rem; font-weight:700; }
  .campo { margin-top:14px; }
  .campo label { display:block; color:var(--muted); font-size:.8125rem; margin-bottom:4px; }
  .campo select { width:100%; }
  .acoes { display:flex; gap:8px; margin-top:18px; }
  .acoes .btn { flex:1; }
  .fonte { margin-top:12px; font-size:.8125rem; }
  .fonte.regra { color:var(--muted); }
  .fonte.nova { color:var(--badge-fg); background:var(--badge-bg);
                padding:8px 10px; border-radius:8px; display:inline-block; }
  .erro-inline { color:#fff; background:var(--perigo); padding:10px 12px;
                 border-radius:8px; margin-top:12px; font-size:.875rem; }
  .lista-lote { max-height:52vh; overflow-y:auto; margin:12px 0; }
  .item-lote { display:flex; gap:10px; align-items:flex-start; padding:10px 0;
               border-bottom:1px solid var(--border2); }
  .item-lote input[type=checkbox] { min-height:24px; width:24px; height:24px; margin-top:2px; flex:none; }
  .item-lote .txt { flex:1; min-width:0; }
  .item-lote .d { font-size:.9375rem; word-break:break-word; }
  .item-lote .s { color:var(--muted); font-size:.8125rem; }
  .progresso { color:var(--muted); font-size:.875rem; margin-top:8px; }
  /* Diálogos (escopo e criação de categoria) — mesmo padrão do app. */
  dialog { border:0; border-radius:var(--raio); padding:18px; max-width:440px; width:92vw;
           background:var(--card); color:var(--text); }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  dialog .campo { margin-top:12px; }
  dialog .campo label { display:block; color:var(--muted); font-size:.8125rem; margin-bottom:4px; }
  dialog select, dialog input { width:100%; }
  dialog input[type=color] { width:44px; min-height:var(--alvo); padding:2px; }
  /* Opções de escopo (este / seguintes / todos). */
  .escopo { padding:12px 4px; border-bottom:1px solid var(--border2); cursor:pointer;
            display:flex; gap:10px; align-items:flex-start; }
  .escopo:last-of-type { border-bottom:0; }
  .escopo input { min-height:22px; width:22px; height:22px; margin-top:1px; flex:none;
                  accent-color:var(--acento); }
  .escopo .rot b { display:block; }
  .escopo .rot span { color:var(--muted); font-size:.8125rem; }
  /* Criação de categoria inline. */
  .criar-cat { display:inline-block; margin-top:6px; font-size:.8125rem;
               color:var(--acento); background:none; border:0; padding:4px 0; cursor:pointer; }
  .lin-cor { display:flex; gap:8px; align-items:center; }
  .lin-cor input[type=text] { flex:1; }
</style>
</head>
<body>

<div class="cabecalho">
  <h1 class="titulo">Triar</h1>
  <span class="frescor" id="frescor"></span>
</div>

<div class="envolucro" id="tela">
  <div class="cartao"><div class="esqueleto"><div class="esq-linha"><div class="esq"></div></div></div></div>
</div>

<dialog id="dlg"></dialog>
<dialog id="dlgCat"></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/modelo.js"></script>
<script src="assets/db.js"></script>
<script src="assets/ui.js"></script>
<script>
'use strict';
const $ = UI.$;
let TX = [], CATS = [], REGRAS = [], GRUPOS = [];
let fila = [], atual = 0, pulados = {};

/* ------------------------------------------------------------------
   Fila
   ------------------------------------------------------------------
   Um lançamento entra aqui por faltar categoria, faltar classificação, ou
   as duas. Medido em 06/08: 620 sem categoria, 623 sem cls, 656 na união —
   quem usar só uma das contas erra por dezenas.

   Mais recente primeiro: é o que a pessoa lembra de ter gastado. */
function montarFila() {
  fila = TX.filter(M.precisaTriagem)
           .sort((a, b) => String(b.data).localeCompare(String(a.data)));
}

// Só conta como resolvível em lote o que a regra resolve POR COMPLETO.
// Regra que preenche metade deixaria o lançamento na fila mesmo assim —
// aplicar em lote daria a impressão de progresso sem tirar ninguém da fila.
function sugestaoCompleta(t) {
  const r = M.regraQueCasa(t.descricao, REGRAS);
  if (!r || !r.categoria_id) return null;
  const cls = (r.cls || '').trim();
  if (!cls || cls === M.CLS_INDEFINIDO) return null;
  return { regra: r, categoria_id: r.categoria_id, cls: cls };
}

function catPorId(id) { return CATS.find(c => c.id === id) || null; }
function nomeCat(id) {
  const c = catPorId(id);
  return c ? c.grupo + ' › ' + c.nome : '—';
}

function opcoesCategoria(sel) {
  const grupos = [];
  CATS.forEach(c => { if (grupos.indexOf(c.grupo) === -1) grupos.push(c.grupo); });
  return '<option value="">— escolher categoria —</option>' + grupos.map(g =>
    '<optgroup label="' + UI.escapar(g) + '">' +
    CATS.filter(c => c.grupo === g && c.ativa).map(c =>
      '<option value="' + c.id + '"' + (c.id === sel ? ' selected' : '') + '>' +
      UI.escapar(c.nome) + '</option>').join('') +
    '</optgroup>').join('');
}

function opcoesCls(sel) {
  return '<option value="">— escolher —</option>' + M.CLS
    .filter(c => c !== M.CLS_INDEFINIDO)   // "A classificar" não é escolha, é ausência
    .map(c => '<option value="' + UI.escapar(c) + '"' + (c === sel ? ' selected' : '') + '>' +
              UI.escapar(M.rotulo(c)) + '</option>').join('');
}

/* ------------------------------------------------------------------
   Tela
   ------------------------------------------------------------------ */
function desenhar() {
  const restantes = fila.filter(t => !pulados[t.id]);
  UI.montarNav('triar', fila.length);
  UI.marcarFrescor($('frescor'), 'tx');

  if (!restantes.length) {
    const houvePulo = Object.keys(pulados).length > 0;
    UI.vazio($('tela'),
      houvePulo ? 'Só sobraram os que você pulou' : 'Fila vazia',
      houvePulo
        ? 'Você pulou ' + Object.keys(pulados).length + '. Eles voltam quando você quiser.'
        : 'Nada esperando classificação. O app já sabe para onde foi cada real.',
      houvePulo ? '<button class="btn" id="btnVoltarPulados">Rever os pulados</button>' : '');
    const b = $('btnVoltarPulados');
    if (b) b.onclick = () => { pulados = {}; atual = 0; desenhar(); };
    return;
  }

  if (atual >= restantes.length) atual = 0;
  const t = restantes[atual];
  const s = sugestaoCompleta(t);
  const emLote = fila.filter(x => !pulados[x.id] && sugestaoCompleta(x)).length;

  const cartaoLote = emLote > 0
    ? '<div class="cartao lote">' +
        '<p style="margin:0 0 4px"><b>' + emLote + '</b> já casam com regras que você ensinou.</p>' +
        '<p class="mudo" style="margin:0 0 12px">Nunca foram reprocessados: regra só vale para lançamento novo.</p>' +
        '<button class="btn" id="btnLote">Revisar em lote</button>' +
      '</div>'
    : '';

  $('tela').innerHTML = cartaoLote +
    '<div class="cartao">' +
      '<div class="tri-topo">' +
        '<span class="tri-meta">' + UI.escapar(M.dataBR(t.data)) + ' · ' + UI.escapar(t.src || '') + '</span>' +
        '<span class="tri-meta">' + (atual + 1) + ' de ' + restantes.length + '</span>' +
      '</div>' +
      '<p class="tri-desc">' + UI.escapar(t.descricao) + '</p>' +
      // Receita (entrada) em verde: sinaliza que é dinheiro entrando, não
      // gasto. Usa o token --ok via a classe .positivo (mesma cor do app).
      '<p class="tri-valor valor' + (M.ehSaida(t) ? '' : ' positivo') + '">' + UI.BRL(t.valor) + '</p>' +
      '<p class="tri-meta">falta: ' + M.motivoTriagem(t) + '</p>' +

      '<div class="campo"><label for="selCat">Categoria</label>' +
        '<select id="selCat">' + opcoesCategoria(s ? s.categoria_id : t.categoria_id) + '</select>' +
        '<button type="button" class="criar-cat" id="btnNovaCat">+ Não achou? Criar categoria</button></div>' +
      '<div class="campo"><label for="selCls">De quem é</label>' +
        // Sem sugestão de regra e sem cls ainda: pré-seleciona "Da casa" (o
        // caso mais comum). Com sugestão, respeita a sugestão; se já tem cls
        // (faltava só categoria), mantém o cls existente.
        '<select id="selCls">' + opcoesCls(s ? s.cls : (M.faltaCls(t) ? M.CLS_PADRAO : t.cls)) + '</select></div>' +

      (s
        ? '<p class="fonte regra">Sugerido pela regra <code>' + UI.escapar(s.regra.padrao) + '</code>. ' +
          'Se estiver errado, corrija — é assim que ela aprende.</p>'
        : '<p class="fonte nova">Primeira vez que vejo este lugar. O que você escolher vira regra.</p>') +

      '<div class="acoes">' +
        '<button class="btn" id="btnSalvar">' + (s ? 'Confirmar' : 'Salvar') + '</button>' +
        '<button class="btn alt" id="btnPular">Pular</button>' +
      '</div>' +
      '<div id="erroSalvar"></div>' +
    '</div>';

  if ($('btnLote')) $('btnLote').onclick = telaLote;
  $('btnPular').onclick = () => { pulados[t.id] = true; desenhar(); };

  // "Mudar" é o evento que ensina, não "Confirmar" (spec §7). O rótulo do
  // botão muda no instante em que a sugestão é contrariada, para a pessoa
  // ver que aquilo vai virar aprendizado.
  const marcarMudanca = () => {
    if (!s) return;
    $('btnSalvar').textContent = 'Salvar e corrigir a regra';
  };
  $('selCat').onchange = marcarMudanca;
  $('selCls').onchange = marcarMudanca;

  // Criar categoria sem sair da triagem: abre o diálogo e, ao criar, já
  // seleciona a nova subcategoria no campo acima (e marca como mudança,
  // para virar/corrigir regra ao salvar).
  $('btnNovaCat').onclick = () => abrirCriarCategoria(s);

  $('btnSalvar').onclick = () => salvar(t, s);
}

/* ------------------------------------------------------------------
   Criar grupo / subcategoria sem sair da Triar
   ------------------------------------------------------------------
   Reusa as mesmas funções da tela Categorias:
     - subcategoria: DB.criarCategoria (a colab também pode)
     - grupo: DB.criarGrupo (RPC, SÓ GESTOR — o RLS e a função barram a
       colab; por isso o campo de grupo novo só aparece para o gestor)
   Ao criar, recarrega dados, reseleciona a subcategoria nova em #selCat e
   marca o card como "mudança" para que o salvar ensine/corrija a regra. */
function opcoesGrupoParaNovaSub() {
  // Grupos que já têm subcategoria (CATS) unidos aos grupos ATIVOS da
  // tabela `grupos` — assim um grupo recém-criado e ainda vazio pode
  // receber a primeira subcategoria (mesma correção da tela Categorias).
  const nomes = [];
  CATS.forEach(c => { if (nomes.indexOf(c.grupo) === -1) nomes.push(c.grupo); });
  GRUPOS.filter(g => g.ativa !== false && g.nome)
        .sort((a, b) => (a.ordem || 0) - (b.ordem || 0))
        .forEach(g => { if (nomes.indexOf(g.nome) === -1) nomes.push(g.nome); });
  return nomes;
}

function abrirCriarCategoria(sugestao) {
  const gestor = DB.ehGestor();
  const grupos = opcoesGrupoParaNovaSub();
  const dlg = $('dlgCat');
  dlg.innerHTML =
    '<p class="titulo" style="margin:0 0 4px">Nova categoria</p>' +
    '<p class="mudo" style="margin:0;font-size:.8125rem">Escolha o grupo e dê um nome à ' +
      'subcategoria. Ela já entra selecionada aqui na triagem.</p>' +
    '<div class="campo"><label for="ncGrupo">Grupo</label>' +
      '<select id="ncGrupo">' +
        grupos.map(g => '<option>' + UI.escapar(g) + '</option>').join('') +
        (gestor ? '<option value="__novo">➕ Novo grupo…</option>' : '') +
      '</select></div>' +

    // Bloco de grupo novo — só gestor, escondido até escolher "Novo grupo…".
    (gestor
      ? '<div id="ncBlocoGrupo" style="display:none">' +
          '<div class="campo"><label for="ncGrupoNome">Nome do novo grupo</label>' +
            '<div class="lin-cor">' +
              '<input id="ncGrupoNome" type="text" autocomplete="off" placeholder="Ex.: Doações">' +
              '<input id="ncGrupoCor" type="color" value="#2f6df0" aria-label="Cor do grupo">' +
            '</div></div>' +
          '<div class="campo"><label for="ncGrupoEixo">Onde entra</label>' +
            '<select id="ncGrupoEixo">' +
              '<option value="despesa">Despesa (entra na Análise e no orçamento)</option>' +
              '<option value="receita">Receita (fora da Análise)</option>' +
              '<option value="movimentacao">Movimentação (fora da Análise)</option>' +
            '</select></div>' +
          '<div class="campo" id="ncLinhaTier"><label for="ncGrupoTier">Tipo de gasto</label>' +
            '<select id="ncGrupoTier">' +
              '<option value="">Sem classificação de gasto</option>' +
              '<option value="fixo">Fixo — chega todo mês</option>' +
              '<option value="variável">Variável — responde a decisão</option>' +
              '<option value="adicional">Adicional — o primeiro a cortar</option>' +
            '</select></div>' +
        '</div>'
      : '') +

    '<div class="campo"><label for="ncNome">Nome da subcategoria</label>' +
      '<input id="ncNome" type="text" autocomplete="off" placeholder="Ex.: Presente"></div>' +
    '<div class="acoes" style="display:flex;gap:8px;margin-top:16px">' +
      '<button class="btn" id="ncOk" style="flex:1">Criar e usar</button>' +
      '<button class="btn alt" id="ncCancel" style="flex:1">Cancelar</button></div>' +
    '<div id="ncErro"></div>';
  if (!dlg.open) dlg.showModal();

  const selGrupo = $('ncGrupo');
  const bloco = $('ncBlocoGrupo');
  if (selGrupo && bloco) {
    selGrupo.onchange = () => {
      bloco.style.display = selGrupo.value === '__novo' ? '' : 'none';
    };
  }
  const selEixo = $('ncGrupoEixo');
  if (selEixo) selEixo.onchange = () => {
    const linha = $('ncLinhaTier');
    if (linha) linha.style.display = selEixo.value === 'despesa' ? '' : 'none';
  };

  $('ncCancel').onclick = () => dlg.close();
  $('ncOk').onclick = () => criarCategoriaInline(sugestao);
}

async function criarCategoriaInline(sugestao) {
  const dlg = $('dlgCat');
  const nome = ($('ncNome').value || '').trim();
  const criarGrupoNovo = $('ncGrupo').value === '__novo';
  const ok = $('ncOk'), cancel = $('ncCancel');
  const erro = $('ncErro');
  erro.innerHTML = '';

  if (!nome) {
    erro.innerHTML = '<div class="erro-inline">Dê um nome à subcategoria.</div>';
    return;
  }

  ok.disabled = true; cancel.disabled = true; ok.textContent = 'Criando…';

  let grupo;
  if (criarGrupoNovo) {
    const gNome = ($('ncGrupoNome').value || '').trim();
    if (!gNome) {
      ok.disabled = false; cancel.disabled = false; ok.textContent = 'Criar e usar';
      erro.innerHTML = '<div class="erro-inline">Dê um nome ao novo grupo.</div>';
      return;
    }
    if (GRUPOS.some(g => g.nome.toLowerCase() === gNome.toLowerCase())) {
      ok.disabled = false; cancel.disabled = false; ok.textContent = 'Criar e usar';
      erro.innerHTML = '<div class="erro-inline">Já existe um grupo com esse nome.</div>';
      return;
    }
    const eixo = $('ncGrupoEixo').value;
    const tier = eixo === 'despesa' ? $('ncGrupoTier').value : '';
    const rg = await DB.criarGrupo(gNome, $('ncGrupoCor').value, tier, eixo);
    if (rg.erro) {
      ok.disabled = false; cancel.disabled = false; ok.textContent = 'Criar e usar';
      erro.innerHTML = '<div class="erro-inline">Não criou o grupo: ' + UI.escapar(rg.erro) + '</div>';
      return;
    }
    grupo = gNome;
  } else {
    grupo = $('ncGrupo').value;
  }

  // Já existe subcategoria com esse nome nesse grupo? Reusa em vez de duplicar.
  const existente = CATS.find(c => c.grupo === grupo &&
    c.nome.toLowerCase() === nome.toLowerCase());
  let novaId;
  if (existente) {
    novaId = existente.id;
  } else {
    const ordem = Math.max.apply(null,
      CATS.filter(c => c.grupo === grupo).map(c => c.ordem).concat([0])) + 1;
    const rc = await DB.criarCategoria(grupo, nome, ordem);
    if (rc.erro) {
      ok.disabled = false; cancel.disabled = false; ok.textContent = 'Criar e usar';
      erro.innerHTML = '<div class="erro-inline">Não criou: ' + UI.escapar(rc.erro) + '</div>';
      return;
    }
    novaId = rc.categoria && rc.categoria.id;
  }

  // Recarrega grupos e categorias (mantém tx/regras do cache).
  const d = await DB.tudo(true);
  TX = d.tx; CATS = d.categorias; REGRAS = d.regras; GRUPOS = d.grupos || [];
  montarFila();

  dlg.close();
  UI.toast(existente ? 'Categoria já existia — selecionada' : 'Categoria criada');

  // Redesenha o card e seleciona a nova subcategoria. desenhar() remonta o
  // #selCat do zero, então a seleção é aplicada depois, sobre o DOM novo.
  desenhar();
  const sel = $('selCat');
  if (sel && novaId) {
    sel.value = String(novaId);
    // Trocar a categoria à mão conta como contrariar a sugestão: o salvar
    // deve ensinar/corrigir a regra. Espelha o efeito do onchange.
    if (sugestao) { const b = $('btnSalvar'); if (b) b.textContent = 'Salvar e corrigir a regra'; }
  }
}

/* ------------------------------------------------------------------
   Gravação
   ------------------------------------------------------------------
   O cartão NÃO avança até a gravação confirmar (spec §9). Se falhar, fica
   onde está com o erro e "Tentar de novo". Não existe fila offline: a
   falha que mais importa é perder classificação feita em sequência com
   sinal ruim, e sumir com o trabalho em silêncio seria pior que travar. */
async function salvar(t, sugestao) {
  const catId = Number($('selCat').value) || null;
  const cls = $('selCls').value || '';
  const box = $('erroSalvar');

  if (!catId || !cls) {
    box.innerHTML = '<div class="erro-inline">Escolha a categoria e de quem é antes de salvar.</div>';
    return;
  }

  // Item que JÁ vinha com sugestão de regra (não é a primeira vez) e cuja
  // CATEGORIA foi trocada: pergunta o escopo (este / seguintes / todos),
  // igual à reclassificação em Lançamentos (PR #24). Item novo (sem
  // sugestão) segue o fluxo direto de sempre — não há regra a "corrigir",
  // é a primeira que se ensina.
  const trocouCategoria = sugestao && sugestao.categoria_id !== catId;
  if (trocouCategoria) { perguntarEscopo(t, sugestao, catId, cls); return; }

  await gravar(t, sugestao, catId, cls);
}

// Gravação direta, sem pergunta de escopo. Usada para: item novo, e para
// confirmação/ajuste de cls de um item com sugestão (categoria inalterada).
async function gravar(t, sugestao, catId, cls) {
  const box = $('erroSalvar');
  const btn = $('btnSalvar');
  const rotulo = btn.textContent;
  btn.disabled = true; btn.textContent = 'Salvando…';
  $('btnPular').disabled = true;
  box.innerHTML = '';

  const r = await DB.classificar(t.id, { categoria_id: catId, cls: cls });

  if (r.erro) {
    btn.disabled = false; btn.textContent = rotulo;
    $('btnPular').disabled = false;
    box.innerHTML = '<div class="erro-inline">Não salvou: ' + UI.escapar(r.erro) +
                    '<br>Nada foi perdido — o lançamento continua aqui.</div>';
    return;
  }

  // Ensina a regra quando não havia sugestão, ou quando a sugestão foi
  // contrariada. Confirmar sugestão certa não ensina nada.
  const mudou = !sugestao || sugestao.categoria_id !== catId || sugestao.cls !== cls;
  if (mudou) {
    const c = catPorId(catId);
    const re = await DB.ensinarRegra(t.descricao, catId, c ? c.nome : null, cls);
    if (re.ok) REGRAS = await DB.regras(true);
    else if (re.motivo === 'padrao-curto') {
      UI.toast('Salvo. A descrição é curta demais para virar regra segura.');
    }
  }

  // Espelha na memória para não reler 3.132 linhas a cada classificação.
  const alvo = TX.find(x => x.id === t.id);
  if (alvo) { alvo.categoria_id = catId; alvo.cls = cls; }
  montarFila();
  UI.toast(mudou ? 'Salvo e aprendido' : 'Confirmado');
  desenhar();
}

/* ------------------------------------------------------------------
   Pergunta de escopo ao trocar a categoria de um item já sugerido
   ------------------------------------------------------------------
   Mesmo espírito do "editar evento recorrente" do calendário (PR #24, em
   Lançamentos): aqui "recorrente" é a regra por descrição que a triagem
   ensina. Só aparece quando havia sugestão e a CATEGORIA mudou. */
function perguntarEscopo(t, sugestao, catId, cls) {
  const podeRegra = M.podeVirarRegra(M.normalizar(t.descricao));
  const dlg = $('dlg');
  dlg.innerHTML =
    '<p class="titulo" style="margin:0 0 4px">Alterar categoria</p>' +
    '<p class="mudo" style="margin:0">' + UI.escapar(t.descricao) + '</p>' +
    '<p class="mudo" style="font-size:.8125rem;margin:2px 0 10px">Vale só para este ' +
      'lançamento ou também para os próximos com a mesma descrição?</p>' +
    '<label class="escopo"><input type="radio" name="esc" value="este" checked>' +
      '<span class="rot"><b>Este evento</b>' +
        '<span>Muda só este lançamento. A regra continua como está.</span></span></label>' +
    (podeRegra
      ? '<label class="escopo"><input type="radio" name="esc" value="seguintes">' +
          '<span class="rot"><b>Este e os eventos seguintes</b>' +
            '<span>Muda este e corrige a regra para os próximos. Não mexe nos anteriores.</span></span></label>' +
        '<label class="escopo"><input type="radio" name="esc" value="todos">' +
          '<span class="rot"><b>Todos os eventos</b>' +
            '<span>Muda este, os anteriores com a mesma descrição e os próximos.</span></span></label>'
      : '<p class="honestidade" style="margin:8px 0 0">A descrição é curta demais para virar ' +
        'uma regra segura, então só dá para mudar este lançamento.</p>') +
    '<div class="acoes" style="display:flex;gap:8px;margin-top:16px">' +
      '<button class="btn" id="okEsc" style="flex:1">OK</button>' +
      '<button class="btn alt" id="cancelEsc" style="flex:1">Cancelar</button></div>' +
    '<div id="progressoEsc" class="mudo" style="font-size:.8125rem;margin-top:8px"></div>' +
    '<div id="erroEsc"></div>';
  if (!dlg.open) dlg.showModal();
  $('cancelEsc').onclick = () => dlg.close();
  $('okEsc').onclick = () => {
    const sel = (document.querySelector('input[name=esc]:checked') || {}).value || 'este';
    aplicarEscopo(t, sugestao, catId, cls, sel);
  };
}

async function aplicarEscopo(t, sugestao, catId, cls, escopo) {
  const cNome = (catPorId(catId) || {}).nome || null;
  const ok = $('okEsc'), cancel = $('cancelEsc');
  ok.disabled = true; cancel.disabled = true; ok.textContent = 'Aplicando…';

  // 1. Sempre grava o lançamento em questão.
  const r0 = await DB.classificar(t.id, { categoria_id: catId, categoria: cNome, cls: cls });
  if (r0.erro) {
    ok.disabled = false; cancel.disabled = false; ok.textContent = 'OK';
    $('erroEsc').innerHTML = '<div class="erro-inline">Não salvou: ' + UI.escapar(r0.erro) +
      '<br>Nada foi perdido — o lançamento continua na fila.</div>';
    return;
  }
  const alvo = TX.find(x => x.id === t.id);
  if (alvo) { alvo.categoria_id = catId; alvo.categoria = cNome; alvo.cls = cls; }

  // 2. "seguintes" e "todos" corrigem/ensinam a regra (vale para os
  //    próximos ingeridos pela VPS/Pluggy).
  let msg = 'Alterado só neste lançamento';
  if (escopo === 'seguintes' || escopo === 'todos') {
    const re = await DB.ensinarRegra(t.descricao, catId, cNome, cls);
    if (re.ok) { REGRAS = await DB.regras(true); msg = 'Alterado e regra corrigida'; }
    else if (re.motivo === 'padrao-curto') {
      msg = 'Alterado. A descrição é curta demais para virar regra.';
    }
  }

  // 3. "todos" reaplica aos que casam o padrão (anteriores inclusive), por
  //    "contém", idêntico ao motor de regras. Empréstimo fica de fora.
  if (escopo === 'todos') {
    const padrao = M.normalizar(t.descricao);
    const regraNova = [{ padrao: padrao, categoria_id: catId }];
    const alvos = TX.filter(x => x.id !== t.id && x.categoria_id !== catId &&
      x.cls !== 'Empréstimo' && M.regraQueCasa(x.descricao, regraNova));
    if (alvos.length) {
      const res = await DB.aplicarLote(
        alvos.map(x => ({ id: x.id, mudancas: { categoria_id: catId, categoria: cNome } })),
        (feitos, total) => { const p = $('progressoEsc'); if (p) p.textContent = feitos + ' de ' + total; }
      );
      alvos.forEach(x => {
        if (res.falhas.some(fa => fa.id === x.id)) return;
        const a2 = TX.find(y => y.id === x.id);
        if (a2) { a2.categoria_id = catId; a2.categoria = cNome; }
      });
      msg = res.ok + ' lançamento' + (res.ok === 1 ? '' : 's') + ' atualizado' +
        (res.ok === 1 ? '' : 's') + (res.falhas.length ? ', ' + res.falhas.length + ' falharam' : '') +
        ' · regra corrigida';
    }
  }

  $('dlg').close();
  montarFila();
  UI.toast(msg);
  desenhar();
}

/* ------------------------------------------------------------------
   Varredura retroativa
   ------------------------------------------------------------------
   PROPOR, NUNCA APLICAR CALADO. Mexer em 102 lançamentos sem a pessoa ver
   seria rápido e errado. */
function telaLote() {
  const itens = fila.filter(t => !pulados[t.id]).map(t => {
    const s = sugestaoCompleta(t);
    return s ? { t, s } : null;
  }).filter(Boolean);

  /* Marca as sugestões que vêm de regra genérica.
     Lote é o modo em que a pessoa NÃO lê linha por linha — é justamente
     onde uma regra abrangente faz o maior estrago. Encontrado em 06/08:
     `PAGAMENTODEPIXQRCO` propunha 16 lançamentos de 12 estabelecimentos
     diferentes, todos para Farmácia. Elas continuam aparecendo, mas
     DESMARCADAS e com o motivo à vista — esconder seria pior. */
  const porRegra = {};
  itens.forEach(it => {
    const p = it.s.regra.padrao;
    (porRegra[p] = porRegra[p] || []).push(it.t.descricao);
  });
  itens.forEach(it => {
    it.generica = M.regraEhGenerica(porRegra[it.s.regra.padrao]);
  });
  const nGenericas = itens.filter(i => i.generica).length;

  $('tela').innerHTML =
    '<div class="cartao">' +
      '<h2 class="titulo" style="margin:0 0 4px">Aplicar regras já aprendidas</h2>' +
      '<p class="mudo" style="margin:0 0 8px">' + itens.length +
        ' lançamentos. Desmarque o que estiver errado — nada é gravado sem você mandar.</p>' +
      (nGenericas
        ? '<p class="honestidade" style="margin-bottom:10px">' + nGenericas +
          ' vieram de regra genérica e já estão <b>desmarcados</b>: o padrão delas é só o ' +
          'texto do banco, sem o nome do estabelecimento, então casam com lojas sem relação. ' +
          'Marque uma a uma se conferir.</p>'
        : '') +
      '<div class="lista-lote">' +
        itens.map((it, i) =>
          '<label class="item-lote">' +
            '<input type="checkbox"' + (it.generica ? '' : ' checked') + ' data-i="' + i + '">' +
            '<span class="txt">' +
              '<span class="d">' + UI.escapar(it.t.descricao) + '</span><br>' +
              '<span class="s">' + UI.escapar(M.dataBR(it.t.data)) + ' · ' + UI.BRL(it.t.valor) + ' → ' +
                UI.escapar(nomeCat(it.s.categoria_id)) + ' · ' + UI.escapar(M.rotulo(it.s.cls)) +
                (it.generica
                  ? '<br><b style="color:var(--badge-fg)">regra genérica (' +
                    UI.escapar(it.s.regra.padrao) + ') — confira</b>'
                  : '') +
              '</span>' +
            '</span>' +
          '</label>').join('') +
      '</div>' +
      '<div class="acoes">' +
        '<button class="btn" id="btnAplicar">Aplicar marcados</button>' +
        '<button class="btn alt" id="btnCancelar">Voltar</button>' +
      '</div>' +
      '<p class="progresso" id="progresso"></p>' +
      '<div id="erroLote"></div>' +
    '</div>';

  $('btnCancelar').onclick = desenhar;
  $('btnAplicar').onclick = async () => {
    const marcados = [...document.querySelectorAll('.item-lote input:checked')]
      .map(cb => itens[Number(cb.dataset.i)]);
    if (!marcados.length) { UI.toast('Nada marcado'); return; }

    $('btnAplicar').disabled = true;
    $('btnCancelar').disabled = true;

    const r = await DB.aplicarLote(
      marcados.map(m => ({ id: m.t.id, mudancas: { categoria_id: m.s.categoria_id, cls: m.s.cls } })),
      (feitos, total) => { $('progresso').textContent = feitos + ' de ' + total; }
    );

    marcados.forEach(m => {
      if (r.falhas.some(f => f.id === m.t.id)) return;
      const alvo = TX.find(x => x.id === m.t.id);
      if (alvo) { alvo.categoria_id = m.s.categoria_id; alvo.cls = m.s.cls; }
    });
    montarFila();

    if (r.falhas.length) {
      // Relatar o que falhou é o ponto: aplicar em lote e dizer "pronto"
      // escondendo 3 erros seria o pior resultado possível.
      $('erroLote').innerHTML = '<div class="erro-inline">' + r.ok + ' aplicados, ' +
        r.falhas.length + ' falharam e continuam na fila.</div>';
      $('btnCancelar').disabled = false;
      $('btnCancelar').textContent = 'Voltar para a fila';
    } else {
      UI.toast(r.ok + ' aplicados');
      desenhar();
    }
  };
}

/* ------------------------------------------------------------------
   Início
   ------------------------------------------------------------------ */
async function carregar(forcar) {
  try {
    const d = await DB.tudo(forcar);
    TX = d.tx; CATS = d.categorias; REGRAS = d.regras; GRUPOS = d.grupos || [];
    montarFila();
    desenhar();
  } catch (e) {
    UI.erro($('tela'), e.message, () => carregar(true));
    UI.montarNav('triar', 0);
  }
}

(async function () {
  const perfil = await UI.exigirSessao();
  if (!perfil) return;
  UI.puxarParaAtualizar(() => carregar(true));
  await carregar(false);
})();
</script>
