<!DOCTYPE html>
<html lang="pt-BR" data-theme="system">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Categorias · Finanças da Família</title>
<meta name="theme-color" content="#2f6df0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="stylesheet" href="assets/app.css">
<style>
  .voltar { text-decoration:none; color:var(--muted); font-size:.9375rem;
            min-height:var(--alvo); display:inline-flex; align-items:center; }
  .grupo-cab { display:flex; align-items:baseline; gap:8px; margin:14px 0 2px; }
  .grupo-cab h2 { font-size:1rem; margin:0; }
  .sub { display:flex; gap:10px; align-items:center; padding:9px 0;
         border-bottom:1px solid var(--border2); }
  .sub:last-child { border-bottom:0; }
  .sub .nome { flex:1; min-width:0; }
  .sub .uso { color:var(--muted); font-size:.8125rem; }
  .sub button { min-height:var(--alvo); min-width:var(--alvo); background:none;
                border:0; color:var(--muted); font-size:1rem; cursor:pointer; }
  .novo { display:flex; gap:8px; margin-top:10px; }
  .novo select { flex:1; } .novo input { flex:1; }
  .arquivada { opacity:.55; }
  dialog { border:0; border-radius:var(--raio); padding:18px; max-width:400px; width:92vw;
           background:var(--card); color:var(--text); }
  dialog::backdrop { background:rgba(0,0,0,.45); }
</style>
</head>
<body>

<div class="cabecalho">
  <h1 class="titulo">Categorias</h1>
  <a class="voltar" href="mais.html">‹ Mais</a>
</div>

<div class="envolucro" id="tela">
  <div class="cartao"><div class="esqueleto"><div class="esq-linha"><div class="esq"></div></div></div></div>
</div>

<dialog id="dlg"></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/modelo.js"></script>
<script src="assets/db.js"></script>
<script src="assets/ui.js"></script>
<script>
'use strict';
const $ = UI.$;
let TX = [], CATS = [], uso = {};

function contarUso() {
  uso = {};
  TX.forEach(t => { if (t.categoria_id) uso[t.categoria_id] = (uso[t.categoria_id] || 0) + 1; });
}

function desenhar() {
  const gestor = DB.ehGestor();
  UI.montarNav('mais', TX.filter(M.precisaTriagem).length);

  const grupos = [];
  CATS.forEach(c => { if (grupos.indexOf(c.grupo) === -1) grupos.push(c.grupo); });

  $('tela').innerHTML =
    '<div class="cartao">' +
      '<p class="mudo" style="margin:0 0 6px">' + CATS.filter(c => c.ativa).length +
        ' subcategorias ativas em ' + grupos.length + ' grupos.</p>' +
      (gestor
        ? '<p class="mudo" style="margin:0;font-size:.8125rem">Arquivar move os lançamentos ' +
          'para outra subcategoria e some da lista — numa operação só, para não ' +
          'deixar lançamento apontando para categoria morta.</p>'
        : '<p class="mudo" style="margin:0;font-size:.8125rem">Você pode <b>criar</b> ' +
          'subcategoria. Renomear e arquivar são do gestor.</p>') +
    '</div>' +

    '<div class="cartao">' +
      grupos.map(g =>
        '<div class="grupo-cab"><h2>' + UI.escapar(g) + '</h2>' +
          '<span class="mudo" style="font-size:.8125rem">' +
            CATS.filter(c => c.grupo === g && c.ativa).length + '</span></div>' +
        CATS.filter(c => c.grupo === g).map(c =>
          '<div class="sub' + (c.ativa ? '' : ' arquivada') + '">' +
            '<span class="nome">' + UI.escapar(c.nome) + (c.ativa ? '' : ' (arquivada)') +
              '<div class="uso">' + (uso[c.id] || 0) + ' lançamento' +
                ((uso[c.id] || 0) === 1 ? '' : 's') + '</div>' +
            '</span>' +
            (gestor && c.ativa
              ? '<button data-ren="' + c.id + '" title="Renomear" aria-label="Renomear ' + UI.escapar(c.nome) + '">✎</button>' +
                '<button data-arq="' + c.id + '" title="Arquivar" aria-label="Arquivar ' + UI.escapar(c.nome) + '">🗄</button>'
              : '') +
          '</div>').join('')).join('') +
    '</div>' +

    '<div class="cartao">' +
      '<p class="mudo" style="margin:0 0 8px">Nova subcategoria</p>' +
      '<div class="novo">' +
        '<select id="novoGrupo">' + grupos.map(g =>
          '<option>' + UI.escapar(g) + '</option>').join('') + '</select>' +
        '<input id="novoNome" placeholder="Nome" autocomplete="off">' +
      '</div>' +
      '<button class="btn" id="btnCriar" style="margin-top:8px">Criar</button>' +
    '</div>';

  $('btnCriar').onclick = async () => {
    const nome = $('novoNome').value.trim();
    const grupo = $('novoGrupo').value;
    if (!nome) { UI.toast('Dê um nome'); return; }
    if (CATS.some(c => c.grupo === grupo && c.nome.toLowerCase() === nome.toLowerCase())) {
      UI.toast('Já existe nesse grupo'); return;
    }
    const ordem = Math.max.apply(null,
      CATS.filter(c => c.grupo === grupo).map(c => c.ordem).concat([0])) + 1;
    const r = await DB.criarCategoria(grupo, nome, ordem);
    if (r.erro) { UI.toast('Não criou: ' + r.erro, 'erro'); return; }
    CATS = await DB.categorias(true);
    $('novoNome').value = '';
    UI.toast('Criada');
    desenhar();
  };

  document.querySelectorAll('[data-ren]').forEach(b => {
    b.onclick = () => renomear(Number(b.dataset.ren));
  });
  document.querySelectorAll('[data-arq]').forEach(b => {
    b.onclick = () => arquivar(Number(b.dataset.arq));
  });
}

function renomear(id) {
  const c = CATS.find(x => x.id === id);
  const dlg = $('dlg');
  dlg.innerHTML =
    '<p class="titulo" style="margin:0 0 8px">Renomear</p>' +
    '<p class="mudo" style="margin:0 0 10px">O texto antigo continua guardado nos ' +
      'lançamentos como histórico. As regras aprendidas seguem apontando para esta ' +
      'mesma categoria — não se perde nenhuma.</p>' +
    '<input id="novoTxt" value="' + UI.escapar(c.nome) + '" style="width:100%">' +
    '<div class="acoes" style="display:flex;gap:8px;margin-top:14px">' +
      '<button class="btn" id="ok" style="flex:1">Salvar</button>' +
      '<button class="btn alt" id="cancel" style="flex:1">Cancelar</button></div>';
  dlg.showModal();
  $('cancel').onclick = () => dlg.close();
  $('ok').onclick = async () => {
    const nome = $('novoTxt').value.trim();
    if (!nome) return;
    $('ok').disabled = true;
    const r = await DB.renomearCategoria(id, nome);
    dlg.close();
    if (r.erro) { UI.toast('Não renomeou: ' + r.erro, 'erro'); return; }
    CATS = await DB.categorias(true);
    UI.toast('Renomeada');
    desenhar();
  };
}

/* Arquivar é a ÚNICA operação do app onde falha no meio corrompe dado:
   mover os lançamentos e arquivar têm que acontecer juntos. Por isso a
   tela não faz dois updates — chama a função `arquivar_categoria` no
   banco, que roda numa transação. */
function arquivar(id) {
  const c = CATS.find(x => x.id === id);
  const n = uso[id] || 0;
  const destinos = CATS.filter(x => x.ativa && x.id !== id);
  const dlg = $('dlg');
  dlg.innerHTML =
    '<p class="titulo" style="margin:0 0 8px">Arquivar “' + UI.escapar(c.nome) + '”</p>' +
    (n
      ? '<p class="mudo" style="margin:0 0 10px"><b>' + n + ' lançamento' + (n === 1 ? '' : 's') +
        '</b> usam esta subcategoria. Para onde vão?</p>' +
        '<select id="destino" style="width:100%">' +
          destinos.map(d => '<option value="' + d.id + '">' + UI.escapar(d.grupo) + ' › ' +
            UI.escapar(d.nome) + '</option>').join('') + '</select>'
      : '<p class="mudo" style="margin:0 0 10px">Nenhum lançamento usa esta subcategoria. ' +
        'Ainda assim é preciso um destino, caso alguma regra aponte para ela.</p>' +
        '<select id="destino" style="width:100%">' +
          destinos.map(d => '<option value="' + d.id + '">' + UI.escapar(d.grupo) + ' › ' +
            UI.escapar(d.nome) + '</option>').join('') + '</select>') +
    '<p class="mudo" style="font-size:.8125rem;margin:10px 0 0">Ela some da lista mas não é ' +
      'apagada — o histórico de para onde as coisas foram tem valor.</p>' +
    '<div class="acoes" style="display:flex;gap:8px;margin-top:14px">' +
      '<button class="btn perigo" id="ok" style="flex:1">Mover e arquivar</button>' +
      '<button class="btn alt" id="cancel" style="flex:1">Cancelar</button></div>' +
    '<div id="erroDlg"></div>';
  dlg.showModal();
  $('cancel').onclick = () => dlg.close();
  $('ok').onclick = async () => {
    $('ok').disabled = true; $('ok').textContent = 'Movendo…';
    const r = await DB.arquivarCategoria(id, Number($('destino').value));
    if (r.erro) {
      // Não fecha o diálogo: a operação é atômica, então ou tudo aconteceu
      // ou nada aconteceu. Fechar daria a impressão de sucesso parcial.
      $('erroDlg').innerHTML = '<p class="honestidade" style="color:var(--perigo)">' +
        UI.escapar(r.erro) + '<br>Nada foi alterado — a operação é atômica.</p>';
      $('ok').disabled = false; $('ok').textContent = 'Tentar de novo';
      return;
    }
    dlg.close();
    const d = await DB.tudo(true);
    TX = d.tx; CATS = d.categorias; contarUso();
    UI.toast((r.resultado && r.resultado.movidas ? r.resultado.movidas : 0) + ' movidos · arquivada');
    desenhar();
  };
}

async function carregar(forcar) {
  try {
    const d = await DB.tudo(forcar);
    TX = d.tx; CATS = d.categorias;
    contarUso();
    desenhar();
  } catch (e) {
    UI.erro($('tela'), e.message, () => carregar(true));
  }
}

(async function () {
  const perfil = await UI.exigirSessao();
  if (!perfil) return;
  await carregar(false);
})();
</script>
</body>
</html>
