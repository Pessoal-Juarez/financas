<!DOCTYPE html>
<html lang="pt-BR" data-theme="system">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Quem me deve · Finanças da Família</title>
<meta name="theme-color" content="#2f6df0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="stylesheet" href="assets/app.css">
<style>
  .voltar { text-decoration:none; color:var(--muted); font-size:.9375rem;
            min-height:var(--alvo); display:inline-flex; align-items:center; }
  .pessoa { padding:12px 0; border-bottom:1px solid var(--border2); }
  .pessoa:last-of-type { border-bottom:0; }
  .pessoa .topo { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .pessoa .nome { font-weight:600; }
  .trilho { height:8px; border-radius:4px; background:var(--border2); margin-top:8px; overflow:hidden; }
  .trilho i { display:block; height:100%; border-radius:4px; }
  .n { color:var(--muted); font-size:.8125rem; }
  .item { display:flex; gap:10px; padding:6px 0; font-size:.875rem; }
  .item .d { flex:1; min-width:0; color:var(--muted); }
  .quitado { color:var(--ok); font-weight:700; }
</style>
</head>
<body>

<div class="cabecalho">
  <h1 class="titulo">Quem me deve</h1>
  <a class="voltar" href="mais.html">‹ Mais</a>
</div>

<div class="envolucro" id="tela">
  <div class="cartao"><div class="esqueleto"><div class="esq-linha"><div class="esq"></div></div></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/modelo.js"></script>
<script src="assets/db.js"></script>
<script src="assets/ui.js"></script>
<script>
'use strict';
const $ = UI.$;
let TX = [], aberta = null;

function desenhar() {
  UI.montarNav('mais', TX.filter(M.precisaTriagem).length);
  const lista = M.emprestimos(TX);
  const aReceber = lista.filter(p => !p.quitado).reduce((a, p) => a + p.falta, 0);
  const quitados = lista.filter(p => p.quitado).length;

  $('tela').innerHTML =
    '<div class="cartao">' +
      '<p class="mudo" style="margin:0">Ainda a receber</p>' +
      '<p class="heroi sensivel">' + UI.BRL0(aReceber) + '</p>' +
      '<p class="heroi-sub">' + lista.filter(p => !p.quitado).length + ' pessoa' +
        (lista.filter(p => !p.quitado).length === 1 ? '' : 's') + ' devendo' +
        (quitados ? ' · ' + quitados + ' já quitou' + (quitados === 1 ? '' : 'ram') : '') + '.</p>' +
      '<p class="honestidade">Empréstimo <b>não conta no custo de vida</b> — é dinheiro seu ' +
        'que está com outra pessoa, não gasto da família.</p>' +
    '</div>' +

    '<div class="cartao">' +
      (lista.length
        ? lista.map(p =>
            '<div class="pessoa">' +
              '<div class="topo">' +
                '<span class="nome">' + UI.escapar(p.pessoa) +
                  (p.semNome
                    ? ' <span class="n" style="font-weight:400">(' + UI.escapar(p.marcador) +
                      ')</span> <a href="triar.html" style="font-weight:400;font-size:.8125rem">' +
                      'quem é? →</a>' : '') +
                '</span>' +
                '<b class="valor ' + (p.quitado ? 'quitado' : '') + '">' +
                  (p.quitado ? 'quitado ✓' : UI.BRL(p.falta)) + '</b>' +
              '</div>' +
              '<div class="n">' + UI.BRL(p.emprestado) + ' emprestados · ' +
                UI.BRL(p.pago) + ' devolvidos</div>' +
              '<div class="trilho"><i style="width:' + p.pct + '%;background:' +
                (p.quitado ? 'var(--ok)' : 'var(--badge-fg)') + '"></i></div>' +
              '<button class="btn alt" style="margin-top:8px;min-height:36px" data-p="' +
                UI.escapar(p.pessoa) + '">' +
                (aberta === p.pessoa ? 'Ocultar lançamentos' : 'Ver lançamentos') + '</button>' +
              (aberta === p.pessoa
                ? '<div style="margin-top:6px">' +
                  p.itens.slice().sort((a, b) => String(b.data).localeCompare(String(a.data)))
                   .map(t => '<div class="item">' +
                     '<span class="d">' + UI.escapar(t.data) + ' · ' + UI.escapar(t.descricao) + '</span>' +
                     '<b class="valor" style="color:' +
                       (M.ehSaida(t) ? 'var(--perigo)' : 'var(--ok)') + '">' +
                       (M.ehSaida(t) ? '−' : '+') + ' ' + UI.BRL(t.valor) + '</b></div>').join('') +
                  '</div>'
                : '') +
            '</div>').join('')
        : '<p class="mudo" style="margin:0">Nenhum empréstimo registrado.</p>') +
    '</div>' +

    '<div class="cartao">' +
      '<p class="mudo" style="margin:0 0 6px">Como registrar</p>' +
      '<p class="mudo" style="font-size:.875rem;margin:0">Comprou no cartão para outra pessoa: ' +
        'classifique como <b>Emprestado</b> e ponha o <b>nome dela na categoria</b>. ' +
        'Quando ela te pagar por Pix, marque a entrada do mesmo jeito — o app cruza os dois ' +
        'e a barra fecha.</p>' +
      '<p class="mudo" style="font-size:.8125rem;margin:8px 0 0">Empréstimo não vira regra ' +
        'automática de propósito: o nome muda a cada caso.</p>' +
    '</div>';

  document.querySelectorAll('[data-p]').forEach(el => {
    el.onclick = () => { aberta = (aberta === el.dataset.p) ? null : el.dataset.p; desenhar(); };
  });
}

async function carregar(forcar) {
  try {
    TX = await DB.transacoes(forcar);
    desenhar();
  } catch (e) { UI.erro($('tela'), e.message, () => carregar(true)); }
}

(async function () {
  const perfil = await UI.exigirSessao();
  if (!perfil) return;
  UI.puxarParaAtualizar(() => carregar(true));
  await carregar(false);
})();
</script>
</body>
</html>
