<!DOCTYPE html>
<html lang="pt-BR" data-theme="system">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Detalhe do grupo · Finanças da Família</title>
<meta name="theme-color" content="#2f6df0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="stylesheet" href="assets/app.css">
<style>
  .voltar { text-decoration:none; color:var(--muted); font-size:.9375rem;
            min-height:var(--alvo); display:inline-flex; align-items:center; }
  .mes-nav { display:flex; align-items:center; gap:8px; }
  .mes-nav button { min-width:var(--alvo); }
  .mes-atual { font-weight:600; min-width:78px; text-align:center; }
  .cmp { color:var(--muted); font-size:.875rem; margin:6px 0 0; }
  .cmp b.alta { color:var(--perigo); }
  .cmp b.queda { color:var(--ok); }
  .sub-linha { display:flex; align-items:center; gap:10px; padding:8px 0;
               border-bottom:1px solid var(--border2); }
  .sub-linha:last-of-type { border-bottom:0; }
  .sub-linha .nome { flex:1; min-width:0; }
  .sub-linha .pct { color:var(--muted); font-size:.8125rem; width:44px; text-align:right; }
  .lanc { display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--border2); }
  .lanc:last-of-type { border-bottom:0; }
  .lanc .d { flex:1; min-width:0; }
  .lanc .d .desc { word-break:break-word; }
  .lanc .d .meta { color:var(--muted); font-size:.8125rem; margin-top:2px; }
  .selo-cls { display:inline-block; font-size:.6875rem; padding:1px 7px; border-radius:20px;
              background:var(--border2); color:var(--muted); }
</style>
</head>
<body>

<div class="cabecalho">
  <h1 class="titulo" id="titulo">Detalhe</h1>
  <a class="voltar" href="inicio.html">‹ Início</a>
</div>

<div class="envolucro" id="tela">
  <div class="cartao"><div class="esqueleto"><div class="esq-linha"><div class="esq"></div></div></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/modelo.js"></script>
<script src="assets/db.js"></script>
<script src="assets/ui.js"></script>
<script>
'use strict';
const $ = UI.$;
let TX = [], CATS = [], MESES = [], grupo = null, mes = null;

function param(nome) {
  return new URLSearchParams(location.search).get(nome);
}

function cat(id) { return CATS.find(c => c.id === id) || null; }
function grupoDe(t) { const c = cat(t.categoria_id); return c ? c.grupo : null; }
function subDe(t) { const c = cat(t.categoria_id); return c ? c.nome : '—'; }
function doMes(m) { return TX.filter(t => M.ym(t.data) === m); }

// Só despesa da família do grupo escolhido — mesma base do Início e da
// Análise. Empresas, receitas e movimentação respondem outra pergunta.
function lancamentosDoGrupo(m) {
  return doMes(m).filter(t => M.despesaFamiliar(t) && grupoDe(t) === grupo);
}

function totalDoGrupo(m) {
  return lancamentosDoGrupo(m).reduce((a, t) => a + (Number(t.valor) || 0), 0);
}

function desenhar() {
  const pendentes = TX.filter(M.precisaTriagem).length;
  UI.montarNav('inicio', pendentes);

  const cor = M.COR_GRUPO[grupo] || '#9aa3b2';
  $('titulo').textContent = grupo;

  const i = MESES.indexOf(mes);
  const lancs = lancamentosDoGrupo(mes).slice().sort((a, b) =>
    String(b.data).localeCompare(String(a.data)));
  const total = totalDoGrupo(mes);

  // Média dos 3 meses anteriores COM dado, para comparar.
  const anteriores = M.mesesAnteriores(mes, 3);
  const totaisAnt = anteriores.map(totalDoGrupo).filter(v => v > 0);
  const media = totaisAnt.length ? totaisAnt.reduce((a, b) => a + b, 0) / totaisAnt.length : 0;
  const difPct = media ? Math.round((total - media) / media * 100) : null;

  // Série dos últimos 6 meses (mais antigo -> mais recente) para o gráfico.
  const serieMeses = MESES.slice(0, 6).slice().reverse();
  const serie = serieMeses.map(m => ({
    rotulo: M.rotuloMes(m),
    valor: totalDoGrupo(m),
    destaque: m === mes
  }));

  // Subcategorias do grupo no mês.
  const porSub = {};
  lancs.forEach(t => {
    const s = subDe(t);
    porSub[s] = (porSub[s] || 0) + (Number(t.valor) || 0);
  });
  const subs = Object.entries(porSub).sort((a, b) => b[1] - a[1]);

  $('tela').innerHTML =
    // Navegação de mês
    '<div class="cartao">' +
      '<div class="mes-nav">' +
        '<button class="btn alt" id="mesAnt" ' + (i >= MESES.length - 1 ? 'disabled' : '') +
          ' aria-label="Mês anterior">‹</button>' +
        '<span class="mes-atual">' + M.rotuloMes(mes) + '</span>' +
        '<button class="btn alt" id="mesProx" ' + (i <= 0 ? 'disabled' : '') +
          ' aria-label="Mês seguinte">›</button>' +
      '</div>' +
    '</div>' +

    // Resumo do grupo
    '<div class="cartao">' +
      '<p class="mudo" style="margin:0"><span class="ponto" style="background:' + cor + '"></span>' +
        UI.escapar(grupo) + ' · ' + M.rotuloMes(mes) + '</p>' +
      '<p class="heroi">' + UI.BRL0(total) + '</p>' +
      (media > 0
        ? '<p class="cmp">Média dos ' + totaisAnt.length + ' meses anteriores com dado: ' +
          UI.BRL(media) + '.' +
          (difPct != null && Math.abs(difPct) >= 1
            ? ' Este mês está <b class="' + (difPct > 0 ? 'alta' : 'queda') + '">' +
              (difPct > 0 ? '+' : '') + difPct + '%</b> em relação a ela.'
            : ' Este mês está em linha com ela.') + '</p>'
        : '<p class="cmp">Sem meses anteriores com dado para comparar.</p>') +
      (serie.some(s => s.valor > 0)
        ? UI.barrasComTendencia(serie, { titulo: grupo + ' mês a mês', cor: cor }) +
          '<p class="mudo" style="font-size:.8125rem;margin:6px 0 0">' +
            UI.leituraDaTendencia(serie) + '</p>'
        : '') +
    '</div>' +

    // Subcategorias
    (subs.length > 1
      ? '<div class="cartao">' +
          '<p class="mudo" style="margin:0 0 8px">Por subcategoria</p>' +
          subs.map(([s, v]) =>
            '<div class="sub-linha">' +
              '<span class="nome">' + UI.escapar(s) + '</span>' +
              '<span class="pct">' + (total ? Math.round(v / total * 100) : 0) + '%</span>' +
              '<b class="valor">' + UI.BRL(v) + '</b>' +
            '</div>').join('') +
        '</div>'
      : '') +

    // Lançamentos
    '<div class="cartao">' +
      '<p class="mudo" style="margin:0 0 8px">Lançamentos · ' +
        lancs.length + (lancs.length === 1 ? ' lançamento' : ' lançamentos') + '</p>' +
      (lancs.length
        ? lancs.map(t =>
            '<div class="lanc">' +
              '<span class="d">' +
                '<div class="desc">' + UI.escapar(t.descricao || '(sem descrição)') + '</div>' +
                '<div class="meta">' + UI.escapar(fmtData(t.data)) + ' · ' + UI.escapar(subDe(t)) +
                  (t.parcela ? ' · ' + UI.escapar(t.parcela) : '') +
                  (t.cls ? ' · <span class="selo-cls">' + UI.escapar(M.rotulo(t.cls)) + '</span>' : '') +
                '</div>' +
              '</span>' +
              '<b class="valor">' + UI.BRL(Number(t.valor) || 0) + '</b>' +
            '</div>').join('')
        : '<p class="mudo" style="margin:0">Nenhum lançamento de ' + UI.escapar(grupo) +
          ' em ' + M.rotuloMes(mes) + '.</p>') +
    '</div>';

  const ant = $('mesAnt'), prox = $('mesProx');
  if (ant) ant.onclick = () => { if (i < MESES.length - 1) { mes = MESES[i + 1]; desenhar(); } };
  if (prox) prox.onclick = () => { if (i > 0) { mes = MESES[i - 1]; desenhar(); } };
}

// '2026-08-22' -> '22/08'. Data curta; o ano já está no seletor de mês.
function fmtData(d) {
  const p = String(d || '').slice(0, 10).split('-');
  return p.length === 3 ? p[2] + '/' + p[1] : String(d || '');
}

async function carregar(forcar) {
  try {
    const d = await DB.tudo(forcar);
    TX = d.tx; CATS = d.categorias;
    MESES = M.mesesComDado(TX);
    // Se o mês da URL não existir nos dados, cai no mais recente com dado.
    if (!mes || MESES.indexOf(mes) === -1) mes = MESES[0];
    desenhar();
  } catch (e) {
    UI.erro($('tela'), e.message, () => carregar(true));
    UI.montarNav('inicio', 0);
  }
}

(async function () {
  const perfil = await UI.exigirSessao();
  if (!perfil) return;

  grupo = param('grupo');
  mes = param('mes');

  // Sem grupo válido não há o que detalhar — volta ao Início em vez de
  // mostrar uma tela quebrada.
  if (!grupo || M.GRUPOS_DESPESA.indexOf(grupo) === -1) {
    UI.montarNav('inicio', 0);
    UI.vazio($('tela'), 'Grupo não encontrado',
      'O detalhamento abre a partir de um grupo do Início.',
      '<a class="btn" href="inicio.html">Voltar ao início</a>');
    return;
  }

  UI.puxarParaAtualizar(() => carregar(true));
  await carregar(false);
})();
</script>
</body>
</html>
