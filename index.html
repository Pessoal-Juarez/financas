<!DOCTYPE html>
<html lang="pt-BR" data-theme="system">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Entrar · Finanças da Família</title>
<meta name="theme-color" content="#2f6df0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="stylesheet" href="assets/app.css">
<style>
  /* Esta é a única tela sem barra de navegação — o padding que o app.css
     reserva para ela sobraria como faixa morta no rodapé. */
  body { padding-bottom: env(safe-area-inset-bottom, 0px); }

  .porta {
    min-height: 100svh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px; padding: 24px 16px; max-width: 380px; margin: 0 auto;
  }
  .marca { text-align: center; }
  .marca h1 { font-size: 1.375rem; font-weight: 700; margin: 0 0 4px; }

  .campos { display: flex; flex-direction: column; gap: 10px; width: 100%; }
  .campos input { width: 100%; }
  .campos .btn { width: 100%; }

  /* Rótulo visível: "e-mail" só no placeholder some assim que a pessoa
     digita, e o autofill do celular preenche sem nunca mostrar qual campo
     é qual. */
  .rot { font-size: .8125rem; color: var(--muted); margin-bottom: -4px; }

  .recado { font-size: .875rem; text-align: center; min-height: 1.25rem; }
  .recado.ruim { color: var(--perigo); }
  .oculto { display: none; }
</style>
</head>
<body>

<div class="porta">

  <div class="marca">
    <h1>Finanças da Família</h1>
    <div class="mudo" id="subtitulo">Abrindo…</div>
  </div>

  <!-- Só aparece depois que sabemos que NÃO há sessão. Sem isso o
       formulário pisca no rosto de quem já está logado. -->
  <form class="campos oculto" id="formulario" autocomplete="on">
    <label class="rot" for="email">E-mail</label>
    <input id="email" name="email" type="email" inputmode="email"
           autocomplete="username" autocapitalize="none" spellcheck="false"
           placeholder="voce@exemplo.com" required>

    <label class="rot" for="senha">Senha</label>
    <input id="senha" name="senha" type="password"
           autocomplete="current-password" placeholder="sua senha" required>

    <button class="btn" type="submit" id="botao">Entrar</button>
  </form>

  <div class="recado" id="recado" role="status" aria-live="polite"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/db.js"></script>
<script>
'use strict';

const $ = (id) => document.getElementById(id);
const formulario = $('formulario'), recado = $('recado'), botao = $('botao');

function dizer(texto, ruim) {
  recado.textContent = texto || '';
  recado.classList.toggle('ruim', !!ruim);
}

/* As mensagens do Supabase vêm em inglês. Traduzir só as que a família
   pode realmente ver — o resto passa cru, porque um texto inesperado
   ajuda mais a diagnosticar do que um "erro desconhecido". */
function traduzir(msg) {
  const m = String(msg || '');
  if (/invalid login credentials/i.test(m)) return 'E-mail ou senha não conferem.';
  if (/email not confirmed/i.test(m)) return 'Esse e-mail ainda não foi confirmado.';
  if (/failed to fetch|network/i.test(m)) return 'Sem conexão com o servidor. Tente de novo.';
  return m;
}

function abrirFormulario() {
  $('subtitulo').textContent = 'Entre para continuar';
  formulario.classList.remove('oculto');
  // Foco só no computador: no celular isso abriria o teclado por cima da
  // tela toda antes da pessoa decidir se quer entrar.
  if (matchMedia('(pointer: fine)').matches) $('email').focus();
}

formulario.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const email = $('email').value.trim(), senha = $('senha').value;
  if (!email || !senha) return dizer('Preencha e-mail e senha.', true);

  botao.disabled = true;
  botao.textContent = 'Entrando…';
  dizer('');

  try {
    const r = await DB.entrar(email, senha);
    if (r.erro) {
      dizer(traduzir(r.erro), true);
      botao.disabled = false;
      botao.textContent = 'Entrar';
      $('senha').select();
      return;
    }
    // replace e não href: o botão Voltar do celular não deve trazer a
    // pessoa de volta para a tela de login já autenticada.
    location.replace('inicio.html');
  } catch (e) {
    dizer(traduzir(e && e.message), true);
    botao.disabled = false;
    botao.textContent = 'Entrar';
  }
});

(async function () {
  // Se o supabase-js não carregou (CDN fora do ar, celular sem rede), o
  // db.js nem chegou a definir DB. Esta é a porta de entrada do app: sem
  // este aviso a tela ficaria branca sem explicação.
  if (typeof DB === 'undefined') {
    $('subtitulo').textContent = 'Não consegui carregar o app';
    dizer('Verifique a conexão e recarregue a página.', true);
    return;
  }
  try {
    if (await DB.sessaoAtual()) { location.replace('inicio.html'); return; }
  } catch (e) {
    // Sessão ilegível não é motivo para travar a porta: cai no login.
  }
  abrirFormulario();
})();
</script>
</body>
</html>
