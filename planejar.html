<!DOCTYPE html>
<html lang="pt-BR" data-theme="system">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Planejar · Finanças da Família</title>
<meta name="theme-color" content="#2f6df0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="stylesheet" href="assets/app.css">
<style>
  .voltar { text-decoration:none; color:var(--muted); font-size:.9375rem;
            min-height:var(--alvo); display:inline-flex; align-items:center; }
  .meta { display:flex; gap:10px; align-items:center; padding:9px 0;
          border-bottom:1px solid var(--border2); }
  .meta:last-of-type { border-bottom:0; }
  .meta .nome { flex:1; min-width:0; }
  .meta .gasto { color:var(--muted); font-size:.8125rem; }
  .meta input { width:112px; text-align:right; }
  .trilho { height:5px; border-radius:3px; background:var(--border2); margin-top:5px; overflow:hidden; }
  .trilho i { display:block; height:100%; border-radius:3px; }
  /* Metas de economia */
  .econ { padding:11px 0; border-bottom:1px solid var(--border2); }
  .econ:last-of-type { border-bottom:0; }
  .econ .topo { display:flex; gap:10px; align-items:baseline; }
  .econ .nome { flex:1; min-width:0; font-weight:600; }
  .econ .prazo { color:var(--muted); font-size:.8125rem; white-space:nowrap; }
  .econ .valores { color:var(--muted); font-size:.8125rem; margin-top:2px; }
  .econ .acoes { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .econ .acoes .btn { min-height:36px; padding:0 12px; font-size:.875rem; }
  .econ .selo-ok { color:var(--ok); font-weight:600; font-size:.8125rem; }
  .novaecon { display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; margin-top:4px; }
  .novaecon label { display:block; color:var(--muted); font-size:.8125rem; margin-bottom:4px; }
  .novaecon .campo-nome { flex:2 1 160px; }
  .novaecon .campo-nome input { width:100%; }
  .novaecon .campo-alvo { flex:1 1 110px; }
  .novaecon .campo-alvo input { width:100%; }
  .novaecon .campo-prazo { flex:1 1 150px; }
  .novaecon .campo-prazo input { width:100%; }
  .patr { display:flex; gap:10px; align-items:center; padding:11px 0;
          border-bottom:1px solid var(--border2); }
  .patr:last-of-type { border-bottom:0; }
  .patr .nome { flex:1; min-width:0; }
  .patr input { width:128px; text-align:right; }
  .selo { font-size:.75rem; padding:1px 8px; border-radius:20px; white-space:nowrap; }
  .selo.auto { background:var(--border2); color:var(--muted); }
  .selo.velho { background:var(--badge-bg); color:var(--badge-fg); font-weight:600; }
</style>
</head>
<body>

<div class="cabecalho">
  <h1 class="titulo">Planejar</h1>
  <a class="voltar" href="mais.html">‹ Mais</a>
</div>

<div class="envolucro" id="tela">
  <div class="cartao"><div class="esqueleto"><div class="esq-linha"><div class="esq"></div></div></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/modelo.js"></script>
<script src="assets/db.js"></script>
<script src="assets/ui.js"></script>
<script>
'use strict';
const $ = UI.$;
let TX = [], CATS = [], PATR = [], METAS = [], MESES = [], METAS_ECON = [];

function grupoDe(t) { const c = CATS.find(x => x.id === t.categoria_id); return c ? c.grupo : null; }
function doMes(m) { return TX.filter(t => M.ym(t.data) === m); }
function metaDe(g) { return METAS.find(m => (m.grupo || m.categoria) === g) || null; }

// Média dos 3 últimos meses COM DADO, por grupo. É a base da sugestão de
// orçamento e do fôlego.
function mediaPorGrupo() {
  const meses = MESES.slice(0, 3);
  const soma = {};
  meses.forEach(m => {
    doMes(m).filter(M.despesaFamiliar).forEach(t => {
      const g = grupoDe(t);
      if (!g || g === M.GRUPO_MOVIMENTACAO || g === M.GRUPO_RECEITAS) return;
      soma[g] = (soma[g] || 0) + (Number(t.valor) || 0);
    });
  });
  const media = {};
  Object.keys(soma).forEach(g => { media[g] = soma[g] / (meses.length || 1); });
  return media;
}

function idadeManual() {
  const manuais = PATR.filter(p => p.fonte !== 'itau');
  const datas = manuais.map(p => p.atualizado_em).filter(Boolean);
  if (!datas.length) return null;
  return Math.floor((Date.now() - new Date(datas.sort().reverse()[0]).getTime()) / 86400000);
}

// Metas de ECONOMIA (reserva, viagem, etc.) — poupança com alvo e prazo,
// diferente do orçamento acima, que são tetos de gasto por grupo.
function cartaoMetasEconomia() {
  const totalAlvo = METAS_ECON.reduce((a, m) => a + (Number(m.alvo) || 0), 0);
  const totalGuardado = METAS_ECON.reduce((a, m) => a + (Number(m.guardado) || 0), 0);

  const lista = METAS_ECON.length
    ? METAS_ECON.map(m => {
        const alvo = Number(m.alvo) || 0;
        const guardado = Math.max(0, Number(m.guardado) || 0);
        const frac = alvo ? Math.min(1, guardado / alvo) : 0;
        const concluida = alvo > 0 && guardado >= alvo;
        const cor = concluida ? 'var(--ok)' : 'var(--acento)';
        return '<div class="econ">' +
          '<div class="topo">' +
            '<span class="nome">' + UI.escapar(m.nome || 'Meta') + '</span>' +
            // '2099-...' é o sentinela de "sem prazo" (deadline_date é NOT NULL
            // no banco); não mostramos como prazo real.
            (m.prazo && m.prazo.slice(0, 4) !== '2099'
              ? '<span class="prazo">até ' + UI.escapar(M.rotuloMes(m.prazo)) + '</span>' : '') +
          '</div>' +
          '<div class="valores">' +
            (concluida
              ? '<span class="selo-ok">✓ Meta alcançada</span> · ' + UI.BRL(guardado)
              : UI.BRL(guardado) + ' de ' + UI.BRL(alvo) +
                ' · faltam ' + UI.BRL(Math.max(0, alvo - guardado))) +
          '</div>' +
          '<div class="trilho"><i style="width:' + Math.round(frac * 100) + '%;background:' + cor + '"></i></div>' +
          '<div class="acoes">' +
            '<button class="btn alt" data-dep="' + m.id + '">Depositar</button>' +
            '<button class="btn alt" data-ret="' + m.id + '">Retirar</button>' +
            '<button class="btn alt" data-editar="' + m.id + '">Editar</button>' +
            '<button class="btn perigo" data-apagar="' + m.id + '">Apagar</button>' +
          '</div>' +
        '</div>';
      }).join('')
    : '<p class="mudo" style="margin:0 0 8px">Nenhuma meta ainda. Crie uma reserva de ' +
      'emergência ou um objetivo (viagem, troca de carro) e acompanhe o progresso.</p>';

  return '<div class="cartao">' +
    '<p class="mudo" style="margin:0 0 8px">Metas de economia' +
      (METAS_ECON.length ? ' · ' + UI.BRL(totalGuardado) + ' guardados de ' + UI.BRL(totalAlvo) : '') +
    '</p>' +
    lista +
    '<div style="border-top:1px solid var(--border2);margin-top:12px;padding-top:12px">' +
      '<p class="mudo" style="margin:0 0 8px">Nova meta</p>' +
      '<div class="novaecon">' +
        '<div class="campo-nome"><label for="ec-nome">Nome</label>' +
          '<input id="ec-nome" type="text" maxlength="60" placeholder="Reserva de emergência"></div>' +
        '<div class="campo-alvo"><label for="ec-alvo">Alvo (R$)</label>' +
          '<input id="ec-alvo" type="number" inputmode="decimal" step="100" min="0" placeholder="15000"></div>' +
        '<div class="campo-prazo"><label for="ec-prazo">Prazo (opcional)</label>' +
          '<input id="ec-prazo" type="month" aria-label="Prazo da meta"></div>' +
      '</div>' +
      '<button class="btn" id="ec-criar" style="margin-top:10px">Criar meta</button>' +
    '</div>' +
  '</div>';
}

function desenhar() {
  const pendentes = TX.filter(M.precisaTriagem).length;
  UI.montarNav('mais', pendentes);

  const media = mediaPorGrupo();
  const mesAtual = MESES[0];
  const gastoDoMes = {};
  doMes(mesAtual).filter(M.despesaFamiliar).forEach(t => {
    const g = grupoDe(t);
    if (!g || g === M.GRUPO_MOVIMENTACAO || g === M.GRUPO_RECEITAS) return;
    gastoDoMes[g] = (gastoDoMes[g] || 0) + (Number(t.valor) || 0);
  });

  const temMetas = METAS.length > 0;
  const liquido = PATR.filter(p => p.liquido).reduce((a, p) => a + (Number(p.valor) || 0), 0);
  const preso = PATR.filter(p => !p.liquido).reduce((a, p) => a + (Number(p.valor) || 0), 0);
  const mediaTotal = Object.values(media).reduce((a, b) => a + b, 0);
  const folego = mediaTotal ? liquido / mediaTotal : null;
  const idade = idadeManual();

  $('tela').innerHTML =
    /* ESTADO DE PRIMEIRA VEZ É A TELA PRINCIPAL enquanto `metas` estiver
       vazia (spec §3). A tabela existe há meses com ZERO linhas: ninguém
       preenche orçamento à mão, e foi exatamente por isso que ela nunca
       saiu do zero. O botão preenche tudo a partir do que já aconteceu. */
    (!temMetas
      ? '<div class="cartao">' +
          '<p class="titulo" style="margin:0 0 6px">Você ainda não tem orçamento</p>' +
          '<p class="mudo" style="margin:0 0 4px">Não vou pedir para você digitar 10 números. ' +
          'Posso partir da sua média dos últimos 3 meses (' +
          MESES.slice(0, 3).map(M.rotuloMes).join(', ') + ') e você ajusta o que quiser.</p>' +
          '<p class="mudo" style="margin:0 0 12px">Total sugerido: <b class="valor">' +
            UI.BRL(mediaTotal) + '</b> por mês.</p>' +
          '<button class="btn" id="btnSugerir">Sugerir meu orçamento</button>' +
        '</div>'
      : '') +

    // Orçamento
    '<div class="cartao">' +
      '<p class="mudo" style="margin:0 0 8px">Orçamento por grupo · comparando com ' +
        M.rotuloMes(mesAtual) + '</p>' +
      M.GRUPOS_DESPESA.filter(g => media[g] || metaDe(g) || gastoDoMes[g]).map(g => {
        const m = metaDe(g);
        const alvo = m ? Number(m.valor_mes) : 0;
        const gasto = gastoDoMes[g] || 0;
        const frac = alvo ? Math.min(1, gasto / alvo) : 0;
        const estourou = alvo && gasto > alvo;
        return '<div class="meta">' +
          '<span class="nome">' + UI.escapar(g) +
            '<div class="gasto">' + UI.BRL(gasto) + ' gastos' +
              (alvo ? ' de ' + UI.BRL(alvo) : ' · média ' + UI.BRL(media[g] || 0)) + '</div>' +
            (alvo ? '<div class="trilho"><i style="width:' + Math.round(frac * 100) + '%;' +
              'background:' + (estourou ? 'var(--perigo)' : (M.COR_GRUPO[g] || '#9aa3b2')) + '"></i></div>' : '') +
          '</span>' +
          '<input type="number" inputmode="decimal" step="10" min="0" data-g="' + UI.escapar(g) + '" ' +
            'value="' + (alvo || '') + '" placeholder="—" aria-label="Meta de ' + UI.escapar(g) + '">' +
        '</div>';
      }).join('') +
      '<p class="mudo" style="font-size:.8125rem;margin:10px 0 0">Sai do campo e salva. ' +
        'Deixe em branco para não ter meta naquele grupo.</p>' +
    '</div>' +

    // Metas de economia
    cartaoMetasEconomia() +

    // Patrimônio
    '<div class="cartao">' +
      '<p class="mudo" style="margin:0 0 8px">Patrimônio</p>' +
      PATR.map(p =>
        '<div class="patr">' +
          '<span class="nome">' + UI.escapar(p.nome) + '<br>' +
            '<span class="selo ' + (p.fonte === 'itau' ? 'auto' : 'velho') + '">' +
              (p.fonte === 'itau' ? 'automático, sync diário' : 'manual') + '</span>' +
            (p.liquido ? '' : ' <span class="selo auto">não conta no fôlego</span>') +
          '</span>' +
          (p.fonte === 'itau'
            ? '<b class="valor sensivel">' + UI.BRL(p.valor) + '</b>'
            : '<input type="number" inputmode="decimal" step="0.01" class="sensivel" data-p="' + p.id + '" ' +
              'value="' + Number(p.valor) + '" aria-label="Valor de ' + UI.escapar(p.nome) + '">') +
        '</div>').join('') +
      (idade != null && idade > 30
        ? '<p class="honestidade"><b>As linhas manuais estão há ' + idade + ' dias sem atualizar.</b> ' +
          'O Open Finance entrega só a conta corrente — o CDB e o BTG não vêm pela API ' +
          '(verificado em 06/08/2026) e somam ' +
          (liquido + preso ? Math.round((liquido + preso - (PATR.find(p => p.fonte === 'itau') || { valor: 0 }).valor) / (liquido + preso) * 100) : 0) +
          '% do patrimônio. Enquanto não forem atualizados, o fôlego abaixo é estimativa.</p>'
        : '') +
    '</div>' +

    // Fôlego
    '<div class="cartao">' +
      '<p class="mudo" style="margin:0">Fôlego</p>' +
      '<p class="heroi sensivel">' + (folego ? folego.toFixed(1).replace('.', ',') + ' meses' : '—') + '</p>' +
      '<p class="heroi-sub">' + UI.BRL(liquido) + ' líquidos ÷ ' + UI.BRL(mediaTotal) +
        ' de custo médio dos últimos 3 meses' +
        (preso ? '<br>' + UI.BRL(preso) + ' preso como garantia não entra na conta.' : '') +
      '</p>' +
    '</div>';

  const bs = $('btnSugerir');
  if (bs) bs.onclick = async () => {
    bs.disabled = true; bs.textContent = 'Preenchendo…';
    for (const g of M.GRUPOS_DESPESA) {
      if (!media[g]) continue;
      const r = await DB.salvarMeta(g, Math.round(media[g]));
      if (r.erro) { UI.toast('Falhou em ' + g + ': ' + r.erro, 'erro'); bs.disabled = false; return; }
    }
    METAS = await DB.metas(true);
    UI.toast('Orçamento criado a partir da sua média');
    desenhar();
  };

  document.querySelectorAll('[data-g]').forEach(el => {
    el.onchange = async () => {
      const g = el.dataset.g, v = el.value.trim();
      const r = v === '' ? await DB.apagarMeta(g) : await DB.salvarMeta(g, Number(v));
      if (r.erro) { UI.toast('Não salvou: ' + r.erro, 'erro'); return; }
      METAS = await DB.metas(true);
      UI.toast('Meta salva');
      desenhar();
    };
  });

  document.querySelectorAll('[data-p]').forEach(el => {
    el.onchange = async () => {
      const r = await DB.salvarPatrimonio(Number(el.dataset.p), Number(el.value));
      if (r.erro) { UI.toast('Não salvou: ' + r.erro, 'erro'); return; }
      PATR = await DB.patrimonio(true);
      UI.toast('Patrimônio atualizado');
      desenhar();
    };
  });

  ligarMetasEconomia();
}

// Relê do banco e redesenha. Mesmo padrão do orçamento e do patrimônio: a
// tela só reflete o estado depois da gravação confirmar (fonte da verdade é
// o banco). Cada meta é uma linha em savings_goals; as operações são por id.
async function recarregarMetasEcon(resultado, msgOk) {
  if (resultado && resultado.erro) { UI.toast('Não salvou: ' + resultado.erro, 'erro'); return false; }
  METAS_ECON = await DB.metasEconomia(true);
  UI.toast(msgOk);
  desenhar();
  return true;
}

function metaEconPorId(id) {
  return METAS_ECON.filter(m => String(m.id) === String(id))[0] || null;
}

function ligarMetasEconomia() {
  const btnCriar = $('ec-criar');
  if (btnCriar) btnCriar.onclick = async () => {
    const nome = ($('ec-nome').value || '').trim();
    const alvo = Number($('ec-alvo').value);
    const prazoBruto = ($('ec-prazo').value || '').trim();     // 'AAAA-MM' do input month
    if (!nome) { UI.toast('Dê um nome para a meta', 'erro'); return; }
    if (!(alvo > 0)) { UI.toast('O alvo precisa ser maior que zero', 'erro'); return; }
    btnCriar.disabled = true;
    const r = await DB.criarMetaEconomia({
      nome: nome.slice(0, 60),
      alvo: Math.round(alvo * 100) / 100,
      prazo: prazoBruto ? prazoBruto + '-01' : ''
    });
    await recarregarMetasEcon(r, 'Meta criada');
  };

  document.querySelectorAll('[data-dep]').forEach(el => {
    el.onclick = async () => {
      const m = metaEconPorId(el.dataset.dep);
      if (!m) return;
      const v = pedirValor('Quanto depositar em "' + m.nome + '"?');
      if (v == null) return;
      el.disabled = true;
      const r = await DB.ajustarGuardadoMetaEconomia(m.id, v);
      await recarregarMetasEcon(r, 'Depósito registrado');
    };
  });

  document.querySelectorAll('[data-ret]').forEach(el => {
    el.onclick = async () => {
      const m = metaEconPorId(el.dataset.ret);
      if (!m) return;
      const v = pedirValor('Quanto retirar de "' + m.nome + '"?');
      if (v == null) return;
      el.disabled = true;
      const r = await DB.ajustarGuardadoMetaEconomia(m.id, -v);
      await recarregarMetasEcon(r, 'Retirada registrada');
    };
  });

  document.querySelectorAll('[data-editar]').forEach(el => {
    el.onclick = async () => {
      const m = metaEconPorId(el.dataset.editar);
      if (!m) return;
      const nome = prompt('Nome da meta:', m.nome);
      if (nome == null) return;
      const alvoTxt = prompt('Valor alvo (R$):', String(m.alvo));
      if (alvoTxt == null) return;
      const alvo = Number(String(alvoTxt).replace(',', '.'));
      if (!(alvo > 0)) { UI.toast('Alvo inválido', 'erro'); return; }
      el.disabled = true;
      const r = await DB.atualizarMetaEconomia(m.id, {
        nome: (nome.trim() || m.nome).slice(0, 60),
        alvo: Math.round(alvo * 100) / 100
      });
      await recarregarMetasEcon(r, 'Meta atualizada');
    };
  });

  document.querySelectorAll('[data-apagar]').forEach(el => {
    el.onclick = async () => {
      const m = metaEconPorId(el.dataset.apagar);
      if (!m) return;
      if (!confirm('Apagar a meta "' + m.nome + '"? O valor guardado é só um registro aqui, não mexe em conta nenhuma.')) return;
      el.disabled = true;
      const r = await DB.apagarMetaEconomia(m.id);
      await recarregarMetasEcon(r, 'Meta apagada');
    };
  });
}

// Lê um valor em reais do usuário. Devolve número > 0 ou null se cancelar/inválido.
function pedirValor(rotulo) {
  const txt = prompt(rotulo + ' (R$)');
  if (txt == null) return null;
  const v = Number(String(txt).replace(',', '.').trim());
  if (!(v > 0)) { UI.toast('Valor inválido', 'erro'); return null; }
  return Math.round(v * 100) / 100;
}

async function carregar(forcar) {
  try {
    const d = await DB.tudo(forcar);
    TX = d.tx; CATS = d.categorias; PATR = d.patrimonio || [];
    METAS = await DB.metas(forcar);
    METAS_ECON = await DB.metasEconomia(forcar);
    MESES = M.mesesComDado(TX);
    desenhar();
  } catch (e) {
    UI.erro($('tela'), e.message, () => carregar(true));
  }
}

(async function () {
  const perfil = await UI.exigirSessao();
  if (!perfil) return;
  // Planejar é só do gestor. O RLS já barra `patrimonio` no banco; isto
  // evita a tela meio quebrada que a colab veria se digitasse a URL.
  if (!DB.ehGestor()) {
    UI.montarNav('mais', 0);
    UI.vazio($('tela'), 'Só o gestor vê esta tela',
      'Orçamento, patrimônio e fôlego ficam com o Juarez.',
      '<a class="btn" href="inicio.html">Voltar ao início</a>');
    return;
  }
  await carregar(false);
})();
</script>
</body>
</html>
