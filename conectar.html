<!DOCTYPE html>
<html lang="pt-BR" data-theme="system">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Conectar banco · Finanças da Família</title>
<meta name="theme-color" content="#2f6df0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="stylesheet" href="assets/app.css">
<style>
  .voltar { text-decoration:none; color:var(--muted); font-size:.9375rem;
            min-height:var(--alvo); display:inline-flex; align-items:center; }
  .banco { display:flex; align-items:center; gap:10px; padding:11px 0;
           border-bottom:1px solid var(--border2); }
  .banco:last-of-type { border-bottom:0; }
  .banco .nome { flex:1; min-width:0; font-weight:600; }
  .banco .selo { font-size:.75rem; padding:1px 8px; border-radius:20px; white-space:nowrap; }
  .banco .selo.on { background:var(--ok); color:#fff; }
  .banco .selo.off { background:var(--border2); color:var(--muted); }
  .itemid { font-family:'DM Mono',ui-monospace,monospace; font-size:.75rem; color:var(--muted);
            word-break:break-all; }
</style>
</head>
<body>

<div class="cabecalho">
  <h1 class="titulo">Conectar banco</h1>
  <a class="voltar" href="mais.html">‹ Mais</a>
</div>

<div class="envolucro" id="tela">
  <div class="cartao"><div class="esqueleto"><div class="esq-linha"><div class="esq"></div></div></div></div>
</div>

<!-- Widget oficial do Pluggy (Pluggy Connect). Resolve os fluxos de MFA/OAuth
     de cada banco; sem ele, conectar Itaú/Nubank exigiria reimplementar QR,
     token, seleção de conta etc. -->
<script src="https://cdn.pluggy.ai/pluggy-connect/v2.9.1/pluggy-connect.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/modelo.js"></script>
<script src="assets/db.js"></script>
<script src="assets/ui.js"></script>
<script>
'use strict';
const $ = UI.$;

// URL do endpoint que gera o Connect Token (roda na VPS, guarda o secret).
// Em produção, apontar para o domínio HTTPS da VPS. Em teste local, o
// connect-token-server.mjs sobe em localhost:8791.
const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? 'http://localhost:8791'
  : ''; // TODO Fase 3: preencher com a URL HTTPS da VPS

// Bancos da família e o status de conexão. O itemId conectado fica em
// `conexoes_pluggy` (Supabase); aqui listamos o que já existe.
const BANCOS = ['Itaú', 'BTG', 'Nubank', 'InfinitePay'];

let CONEXOES = [];

async function carregarConexoes() {
  // Tabela conexoes_pluggy: { id, instituicao, item_id, status, criado_em }.
  // Só gestor lê/escreve (RLS). Se a tabela ainda não existir (Fase 3),
  // trata como vazio para a tela não quebrar.
  try {
    const r = await DB.sb.from('conexoes_pluggy').select('*').order('criado_em', { ascending: false });
    if (r.error) return [];
    return r.data || [];
  } catch (e) { return []; }
}

function desenhar() {
  UI.montarNav('mais', 0);

  const conexaoDe = (nome) => CONEXOES.filter(c => c.instituicao === nome)[0] || null;

  $('tela').innerHTML =
    '<div class="cartao">' +
      '<p class="mudo" style="margin:0 0 4px">Conecte as contas via Open Finance (Pluggy). ' +
        'A sincronização passa a ser diária e automática.</p>' +
      '<p class="mudo" style="font-size:.8125rem;margin:0 0 12px">' +
        'Só o gestor conecta. As credenciais do banco são digitadas na tela do próprio ' +
        'Pluggy/banco — este app nunca as vê.</p>' +
      BANCOS.map(nome => {
        const c = conexaoDe(nome);
        const on = c && (c.status === 'UPDATED' || c.status === 'ok');
        return '<div class="banco">' +
          '<span class="nome">' + UI.escapar(nome) +
            (c && c.item_id ? '<div class="itemid">item ' + UI.escapar(c.item_id) + '</div>' : '') +
          '</span>' +
          '<span class="selo ' + (on ? 'on' : 'off') + '">' + (on ? 'conectado' : 'não conectado') + '</span>' +
          '<button class="btn" data-conectar="' + UI.escapar(nome) + '">' +
            (c ? 'Reconectar' : 'Conectar') + '</button>' +
        '</div>';
      }).join('') +
    '</div>' +

    '<div class="cartao">' +
      '<p class="mudo" style="margin:0 0 6px">Como funciona</p>' +
      '<p class="mudo" style="font-size:.8125rem;margin:0">1. Toque em Conectar. ' +
        '2. Escolha o banco e autorize no Open Finance. ' +
        '3. Pronto — o Pluggy passa a atualizar os lançamentos todo dia.</p>' +
    '</div>';

  document.querySelectorAll('[data-conectar]').forEach(el => {
    el.onclick = () => abrirWidget(el.dataset.conectar);
  });
}

async function abrirWidget(instituicao) {
  if (!API_BASE) {
    UI.toast('Endpoint de conexão ainda não configurado (Fase 3 / VPS).', 'erro');
    return;
  }
  UI.toast('Preparando conexão…');

  let accessToken;
  try {
    const resp = await fetch(API_BASE + '/connect-token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ clientUserId: DB.usuario ? DB.usuario.id : 'gestor' }),
    });
    const data = await resp.json();
    if (!resp.ok || !data.accessToken) throw new Error('sem token');
    accessToken = data.accessToken;
  } catch (e) {
    UI.toast('Não consegui gerar o token de conexão. Veja o servidor.', 'erro');
    return;
  }

  // eslint-disable-next-line no-undef
  const pluggy = new PluggyConnect({
    connectToken: accessToken,
    includeSandbox: (location.hostname === 'localhost'),
    onSuccess: async (itemData) => {
      const item = itemData && itemData.item ? itemData.item : itemData;
      await salvarConexao(instituicao, item);
      UI.toast('Banco conectado! Sincronização diária ativada.');
      CONEXOES = await carregarConexoes();
      desenhar();
    },
    onError: (err) => {
      UI.toast('A conexão não foi concluída.', 'erro');
      if (err) console.error('PluggyConnect error:', err);
    },
  });
  pluggy.init();
}

async function salvarConexao(instituicao, item) {
  if (!item || !item.id) return;
  try {
    const r = await DB.sb.from('conexoes_pluggy').upsert({
      instituicao: instituicao,
      item_id: item.id,
      status: item.status || 'CREATED',
      criado_em: new Date().toISOString(),
    }, { onConflict: 'item_id' });
    if (r.error) UI.toast('Conectou, mas não salvei o vínculo: ' + r.error.message, 'erro');
  } catch (e) {
    UI.toast('Conectou, mas não salvei o vínculo.', 'erro');
  }
}

(async function () {
  const perfil = await UI.exigirSessao();
  if (!perfil) return;
  // Só gestor: conexão bancária é decisão do dono, e o RLS de conexoes_pluggy
  // já barra a colab; isto evita a tela meio quebrada que ela veria.
  if (!DB.ehGestor()) {
    UI.montarNav('mais', 0);
    UI.vazio($('tela'), 'Só o gestor conecta bancos',
      'A conexão via Open Finance fica com o Juarez.',
      '<a class="btn" href="inicio.html">Voltar ao início</a>');
    return;
  }
  CONEXOES = await carregarConexoes();
  desenhar();
})();
</script>
</body>
</html>
