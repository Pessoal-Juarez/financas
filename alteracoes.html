<!DOCTYPE html>
<html lang="pt-BR" data-theme="system">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Alterações · Finanças da Família</title>
<meta name="theme-color" content="#2f6df0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="stylesheet" href="assets/app.css">
<style>
  .voltar { text-decoration:none; color:var(--muted); font-size:.9375rem;
            min-height:var(--alvo); display:inline-flex; align-items:center; }
  .alt { padding:11px 0; border-bottom:1px solid var(--border2); }
  .alt:last-child { border-bottom:0; }
  .alt .d { font-size:.9375rem; word-break:break-word; }
  .alt .mud { margin-top:4px; font-size:.875rem; }
  .de { color:var(--muted); text-decoration:line-through; }
  .para { color:var(--ok); font-weight:600; }
  .alt .n { color:var(--muted); font-size:.8125rem; margin-top:3px; }
  .filtro { display:flex; gap:8px; }
  .filtro select { flex:1; }
</style>
</head>
<body>

<div class="cabecalho">
  <h1 class="titulo">Alterações</h1>
  <a class="voltar" href="mais.html">‹ Mais</a>
</div>

<div class="envolucro" id="tela">
  <div class="cartao"><div class="esqueleto"><div class="esq-linha"><div class="esq"></div></div></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/modelo.js"></script>
<script src="assets/db.js"></script>
<script src="assets/ui.js"></script>
<script>
'use strict';
const $ = UI.$;
let LOG = [], fAutor = '', fCampo = '';

function desenhar() {
  UI.montarNav('mais', 0);

  const autores = [...new Set(LOG.map(l => l.autor).filter(Boolean))];
  const campos = [...new Set(LOG.map(l => l.campo).filter(Boolean))];
  const lista = LOG.filter(l =>
    (!fAutor || l.autor === fAutor) && (!fCampo || l.campo === fCampo));

  $('tela').innerHTML =
    '<div class="cartao">' +
      '<p class="mudo" style="margin:0 0 8px">Toda mudança de classificação fica registrada ' +
        'aqui, com o antes e o depois. A Raiane edita livre — não existe fila de aprovação — ' +
        'e este histórico é o que mantém a coisa transparente.</p>' +
      '<div class="filtro">' +
        '<select id="fa"><option value="">Todos</option>' +
          autores.map(a => '<option' + (fAutor === a ? ' selected' : '') + '>' +
            UI.escapar(a) + '</option>').join('') + '</select>' +
        '<select id="fc"><option value="">Todo campo</option>' +
          campos.map(c => '<option' + (fCampo === c ? ' selected' : '') + '>' +
            UI.escapar(c) + '</option>').join('') + '</select>' +
      '</div>' +
      '<p class="mudo" style="font-size:.8125rem;margin:8px 0 0">' + lista.length +
        ' de ' + LOG.length + ' registros.</p>' +
    '</div>' +

    '<div class="cartao">' +
      (lista.length
        ? lista.slice(0, 100).map(l =>
            '<div class="alt">' +
              '<div class="d">' + UI.escapar(l.descricao || '(sem descrição)') + '</div>' +
              '<div class="mud">' + UI.escapar(l.campo || 'campo') + ': ' +
                '<span class="de">' + UI.escapar(l.de || '—') + '</span> → ' +
                '<span class="para">' + UI.escapar(l.para || '—') + '</span></div>' +
              '<div class="n">' + UI.escapar(l.autor || 'alguém') + ' · ' +
                UI.escapar(String(l.criado_em || '').slice(0, 16).replace('T', ' ')) + '</div>' +
            '</div>').join('') +
          (lista.length > 100
            ? '<p class="mudo" style="font-size:.8125rem;margin:8px 0 0">Mostrando os 100 ' +
              'mais recentes de ' + lista.length + '.</p>' : '')
        : '<p class="mudo" style="margin:0">Nenhuma alteração registrada' +
          (fAutor || fCampo ? ' com esses filtros' : ' ainda') + '.</p>') +
    '</div>';

  $('fa').onchange = e => { fAutor = e.target.value; desenhar(); };
  $('fc').onchange = e => { fCampo = e.target.value; desenhar(); };
}

async function carregar(forcar) {
  try {
    LOG = await DB.logAlteracoes(forcar);
    desenhar();
  } catch (e) { UI.erro($('tela'), e.message, () => carregar(true)); }
}

(async function () {
  const perfil = await UI.exigirSessao();
  if (!perfil) return;
  UI.puxarParaAtualizar(() => carregar(true));
  await carregar(false);
})();
</script>
</body>
</html>
